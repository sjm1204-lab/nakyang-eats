<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>낙양이츠</title>
<!--
  사진 넣는 법: 아래 스크립트 맨 위 IMG 객체에 키별로 data URI를 넣으면 '사진 자리'가 그 사진으로 바뀝니다.
  예) IMG["s1m2"] = "data:image/jpeg;base64,...";
  키 이름: 가게 큰 사진 s1~s5, 목록 카드 s1-a/s1-b/s1-c, 메뉴 s1m1 등, 카테고리 cat-lamb 등, 리뷰 r-s1-0 등
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: 실제 배달앱처럼 짧고 가벼운 말투, 근거 칸만 차분하게
   IDEA: 북위 낙양 귀정리로 배달하는 앱
   PICTURE: 앱 화면 그 자체, 음식 사진 자리는 비워 둠
   COLOUR and TYPE: 흰 바탕, 하늘색 카트, 남색 사료 배지, 주홍 띠 / Noto Sans KR
   LAYOUT: 휴대폰 폭 한 줄, 데스크톱에서는 가운데 정렬 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#16181d);--page:light-dark(#e9ecf0,#0b0c0f);--ink:light-dark(#1b2230,#eef1f6);--sub:light-dark(#6b7484,#9ba4b3);--line:light-dark(#eceef2,#2a2e37);--soft:light-dark(#f4f6f9,#1f2229);--soft2:light-dark(#e7eaef,#262a32);--blue:#2a9df4;--blue2:light-dark(#e9f5fe,#14283a);--navy:light-dark(#173b70,#8db8ff);--red:#e0452c;--gold:#f5b70a;--band:#a83a26}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.ph{display:grid;place-items:center;width:100%;height:100%;object-fit:cover;background:repeating-linear-gradient(135deg,var(--soft) 0 10px,var(--soft2) 10px 20px);color:var(--sub);font-size:12px;text-align:center;line-height:1.3}
.ph small{font-size:10px;opacity:.75}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;vertical-align:middle;white-space:nowrap}
.b1{background:light-dark(#e6effc,#1b2b47);color:var(--navy)}
.b2{background:light-dark(#e3f5ee,#17322a);color:light-dark(#0f6b55,#6fd9b5)}
.b3{background:var(--soft);color:var(--sub);font-weight:500}
.scroll-x{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:none;scroll-snap-align:start}
/* 홈 */
.promo{background:var(--band);color:#fff;padding:22px 20px 44px;text-align:center}
.promo p{margin:0 0 14px;font-size:17px;font-weight:700}
.promo b{color:#ffd66b}
.scratch{position:relative;height:108px;max-width:300px;margin:0 auto;border-radius:12px;overflow:hidden;background:#fff;color:#1b2230;display:grid;place-items:center}
.scratch .res{font-size:19px;font-weight:800;color:var(--band)}
.scratch .res small{display:block;font-size:12px;font-weight:500;color:#6b7484}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.lnk{font-size:12px;color:#ffe3dc;text-decoration:underline;margin-top:8px}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;margin-top:-22px;position:relative;padding:18px 0 8px}
.addr{display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.addr button{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;min-height:44px}
.addr svg{width:22px;height:22px}
.sbar{display:flex;align-items:center;gap:10px;margin:8px 20px 16px;padding:12px 16px;border:1px solid var(--line);border-radius:28px;box-shadow:0 2px 8px #0000000f;color:var(--sub);width:calc(100% - 40px);font-size:16px}
.sbar svg{width:20px;height:20px;color:var(--ink)}
.cats{padding:0 20px}
.cat{width:68px;text-align:center;font-size:13px;font-weight:500}
.cat .ph{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;font-size:10px}
.cat2{width:76px;text-align:center;font-size:12.5px;line-height:1.3}
.cat2 i{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 6px;border-radius:50%;font-style:normal;font-weight:800;font-size:13px;color:#fff}
.hr{height:8px;background:var(--soft);margin:16px 0}
.banners{padding:0 20px}
.bn{width:calc(100vw - 72px);max-width:350px;border-radius:14px;padding:18px;color:#fff;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.bn b{font-size:18px;line-height:1.3}
.bn span{font-size:12px;opacity:.85}
h2{font-size:18px;margin:6px 20px 10px}
.rank{list-style:none;margin:0;padding:0 20px}
.rank li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank em{font-style:normal;font-weight:800;color:var(--blue);width:18px}
.rank .ph{width:48px;height:48px;border-radius:8px;flex:none}
.rank div{flex:1}
.rank small{color:var(--sub);display:block;font-size:12px}
.note{font-size:12px;color:var(--sub);margin:8px 20px 0}
/* 가게 카드 */
.sc{display:block;width:100%;text-align:left;padding:0 20px 22px}
.sc-img{display:grid;grid-template-columns:2.6fr 1fr;gap:4px;height:190px;position:relative}
.sc-img>.ph{border-radius:12px 0 0 12px}.sc-img .side>.ph:first-child{border-radius:0 12px 0 0}.sc-img .side>.ph:last-child{border-radius:0 0 12px 0}
.sc-img .side{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:4px;height:190px}.sc-img .ph{height:100%;min-height:0}
.sc-promo{position:absolute;left:10px;right:10px;bottom:-14px;background:var(--navy);color:light-dark(#fff,#0b1730);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;text-align:center}
.sc-h{display:flex;align-items:center;gap:6px;margin-top:22px}
.sc-h b{font-size:18px}
.sc-h .tm{margin-left:auto;color:var(--sub)}
.meta{color:var(--sub);font-size:13.5px;margin:2px 0 6px}
.meta .st{color:var(--gold)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--blue2);color:var(--blue);font-weight:700}
.tag.g{background:var(--soft);color:var(--ink);font-weight:500}
/* 공통 헤더 */
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.hd h1{flex:1;text-align:center;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center}
.ib svg{width:24px;height:24px}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;padding:12px 16px;font-size:15px;color:var(--sub);border-bottom:3px solid transparent}
.tabs .on{color:var(--blue);border-color:var(--blue);font-weight:700}
.logos{padding:14px 20px}
.logo{width:70px;text-align:center;font-size:12px}
.logo .lgo{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;margin:0 auto 4px;color:#fff;font-style:normal;font-weight:800;font-size:26px}
.logo .ph{width:60px;height:60px;border-radius:50%;margin:0 auto 4px;font-size:10px}
.frow{display:flex;align-items:center;gap:8px;padding:6px 20px 12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);min-height:44px}
.chk i{width:22px;height:22px;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:14px}
.chk.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.pill{margin-left:auto;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px}
.adl{font-size:13px;color:var(--sub);padding:0 20px 10px}
/* 가게 상세 */
.hero{height:240px;position:relative}
.hero-btns{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;color:#fff}
.hero-btns .ib{background:#0006;border-radius:50%;width:40px;height:40px}
.hero-btns .sp{flex:1}
.hero-btns svg{width:22px;height:22px}
.ib.fav-on svg{fill:var(--red);color:var(--red)}
.card{margin:-60px 20px 0;position:relative;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:20px 16px;text-align:center;box-shadow:0 2px 10px #0000000d}
.card h1{margin:0;font-size:24px}
.card .rt{font-size:16px;font-weight:700;margin:4px 0 10px}
.card .tags{justify-content:center}
.intro{margin:12px 0 0;padding:10px 12px;background:var(--soft);border-radius:8px;text-align:left;font-size:14px}
.intro small{display:block;color:var(--sub);font-size:12px;margin-top:4px}
.dtabs{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-bottom:1px solid var(--line)}
.dtabs button{padding:14px;font-size:17px;font-weight:700;border-bottom:3px solid transparent;color:var(--sub)}
.dtabs .on{color:var(--blue);border-color:var(--blue)}
.info{padding:14px 20px;display:grid;grid-template-columns:80px 1fr;gap:8px 10px;font-size:15px}
.info .l{color:var(--sub)}
.info .row1{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.info .row1 button{font-weight:500;color:var(--sub);font-size:14px;min-height:36px}
.cpn{display:flex;align-items:center;justify-content:space-between;margin:4px 20px 10px;padding:14px 16px;border-radius:10px;background:var(--navy);color:light-dark(#fff,#0b1730);font-weight:700;width:calc(100% - 40px);text-align:left}
.notice{margin:6px 20px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.notice b{display:block;margin-bottom:2px}
.notice small{color:var(--sub)}
.rvs{padding:4px 20px 8px}
.rvc{width:240px;display:flex;gap:10px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px}
.rvc .ph{width:76px;height:76px;border-radius:6px;flex:none}
.rvc p{margin:0;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rvc .st{color:var(--gold);font-size:13px}
.grp{font-size:18px;font-weight:800;margin:20px 20px 4px}
.mi{display:flex;gap:12px;width:100%;text-align:left;padding:14px 20px;border-bottom:1px solid var(--line)}
.mi div{flex:1}
.mi b{font-size:16px}
.mi p{margin:2px 0;color:var(--sub);font-size:13px}
.mi .pr{font-weight:700;color:var(--ink);font-size:15px}
.mi .ph{width:92px;height:92px;border-radius:10px;flex:none}
.best{color:var(--red);font-size:12px;font-weight:700;margin-right:4px}
.soon{margin:10px 20px;padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--sub);font-size:13px}
/* 메뉴 상세 */
.mhero{height:300px;position:relative}
.mhero .hero-btns{color:#fff}
.mbody{padding:20px}
.mbody h1{margin:0 0 2px;font-size:24px}
.mbody .han{color:var(--sub);font-size:14px}
.mbody .desc{color:var(--sub);margin:10px 0 14px;font-size:15px}
.chip{display:inline-block;background:var(--soft);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:500}
.mrow{display:flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;color:var(--sub);font-size:14px}
.mrow svg{width:18px;height:18px}
.basis{margin:16px 0 0;padding:14px;border-radius:12px;background:var(--soft)}
.basis h3{margin:0 0 8px;font-size:15px}
.basis p{margin:0 0 8px;font-size:14px}
.basis .bd{margin-right:6px}
.basis small{display:block;color:var(--sub);font-size:12.5px;border-top:1px solid var(--line);padding-top:8px}
.line{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-top:1px solid var(--line)}
.line .t{font-size:18px;font-weight:700}
.price{text-align:right;font-size:20px;font-weight:800}
.price small{display:block;color:var(--red);font-size:18px}
.price small.o{color:var(--sub);text-decoration:line-through;font-size:14px;font-weight:500}
.qty{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:800}
.qty button{width:44px;height:44px;border:1.5px solid var(--line);border-radius:50%;font-size:22px;color:var(--sub)}
.og{background:var(--soft);display:flex;justify-content:space-between;padding:16px 20px;font-size:17px;font-weight:700}
.og span{color:var(--red);font-size:15px}
.og span.n{color:var(--sub)}
.oc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 20px;font-size:16px;min-height:52px}
.oc i{width:26px;height:26px;border:2px solid var(--line);border-radius:50%;flex:none;display:grid;place-items:center}
.oc.on i{border-color:var(--blue)}
.oc.on i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue)}
/* 리뷰 */
.rv{padding:18px 20px;border-bottom:8px solid var(--soft)}
.rv-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rv-h b{font-size:16px}
.rv-h small{color:var(--sub);font-size:13px}
.rv .st{color:var(--gold);font-size:17px;letter-spacing:1px}
.rv .dt{color:var(--sub);font-size:13px;margin-left:6px}
.rv .ph{height:220px;border-radius:6px;margin:10px 0}
.rv p{margin:10px 0;font-size:15px}
.rv .chips{display:flex;gap:6px;flex-wrap:wrap}
.rv .chips span{background:var(--blue2);color:var(--blue);border-radius:16px;padding:5px 12px;font-size:13px;font-weight:500}
.own{position:relative;margin-top:14px;background:var(--soft);border-radius:10px;padding:14px}
.own::before{content:"";position:absolute;top:-8px;left:20px;border:8px solid transparent;border-top:0;border-bottom-color:var(--soft)}
.own b{font-size:14px}
.own p{margin:6px 0;font-size:14px}
.own small{color:var(--sub);font-size:12px}
.more{color:var(--blue);font-size:13px;font-weight:700;margin-top:8px;min-height:36px}
/* 카트, 주문 */
.ci{display:flex;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ci div{flex:1}
.ci p{margin:2px 0;color:var(--sub);font-size:13px}
.ci .qty{font-size:16px;gap:10px}
.ci .qty button{width:34px;height:34px;font-size:18px}
.sum{padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:6px;font-size:15px}
.sum .t{font-size:18px;font-weight:800}
.sum .dc{color:var(--red)}
textarea{width:calc(100% - 40px);margin:0 20px;border:1px solid var(--line);border-radius:10px;padding:12px;font:16px "Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);resize:vertical;min-height:70px}
.lbl{font-weight:700;margin:16px 20px 8px}
.steps{list-style:none;margin:0;padding:10px 20px}
.steps li{display:flex;gap:14px;padding:12px 0;color:var(--sub);font-size:16px;align-items:center}
.steps i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;flex:none}
.steps .on{color:var(--ink);font-weight:700}
.steps .on i{background:var(--blue);border-color:var(--blue);color:#fff}
.big{padding:24px 20px 6px}
.big h2{margin:0;font-size:26px}
.big p{color:var(--sub);margin:4px 0 0}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
.ol{display:block;width:100%;text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}
.ol small{color:var(--sub);display:block}
/* 검색, 마이, 이벤트 */
.sin{display:flex;gap:8px;padding:10px 20px}
.sin input{flex:1;border:1px solid var(--line);border-radius:24px;padding:11px 16px;font:16px "Noto Sans KR",sans-serif;background:var(--soft);color:var(--ink)}
.kw{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 12px}
.kw button{border:1px solid var(--line);border-radius:18px;padding:7px 14px;font-size:14px}
.alert{margin:10px 20px;padding:14px;border-radius:10px;background:var(--blue2);font-size:14px}
.alert small{display:block;color:var(--sub);margin-top:4px}
.sec{padding:18px 20px;border-bottom:8px solid var(--soft)}
.sec h3{margin:0 0 10px;font-size:17px}
.sec p,.sec li{font-size:14px;margin:0 0 8px}
.sec ul{padding-left:18px;margin:0}
.lg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:14px}
.ev{margin:16px 20px;padding:22px;border-radius:16px;background:var(--band);color:#fff;text-align:center}
.ev .n{font-size:52px;font-weight:800;line-height:1.05}
.ev .n small{font-size:20px}
.ev p{margin:6px 0 0;opacity:.9}
.flock{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.flock i{width:40px;height:40px;border-radius:50%;border:2px dashed #ffffff80;display:grid;place-items:center;font-style:normal;font-weight:800}
.flock i.on{background:#fff;color:var(--band);border-style:solid}
.btns{display:grid;gap:10px;padding:0 20px}
.btn{min-height:52px;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:16px}
.btn.l{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* 하단 고정 */
.dock{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);z-index:20}
.tick{margin:0 12px 8px;background:light-dark(#fff8e8,#2a2414);border:2px solid #d8a548;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px #00000014}
.tick div{flex:1;font-size:13px;line-height:1.35}
.tick b{font-size:16px}
.tick .num{color:var(--red);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.cbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--blue);color:#fff;padding:16px 20px;font-size:18px;font-weight:700}
.cbar i{background:#fff;color:var(--blue);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-size:14px}
.cbar span{margin-left:auto;font-size:20px;font-weight:800}
.cta{width:100%;background:var(--blue);color:#fff;padding:18px;font-size:18px;font-weight:700;text-align:center}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav button{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--sub);min-height:50px}
.nav svg{width:26px;height:26px}
.nav .on{color:var(--ink);font-weight:700}
/* 모달, 토스트 */
.mo{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mo-bg{position:absolute;inset:0;background:#0008}
.mo-sh{position:relative;width:min(430px,100%);max-height:85vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:22px 20px 26px}
.mo-sh h3{margin:0 0 10px;font-size:19px}
.mo-sh p{font-size:14.5px;margin:0 0 10px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.vs button{min-height:90px;border-radius:14px;border:2px solid var(--line);font-size:22px;font-weight:800}
.vs button.on{border-color:var(--blue);color:var(--blue)}
.srcl{list-style:none;padding:0;margin:0}
.srcl li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.srcl small{display:block;color:var(--sub)}

V.orders=()=>`<header class="hd"><h1>주문내역</h1></header>${st.orders.length?st.orders.map(o=>`<button class="ol" data-a="order" data-x="${o.id}"><b>${SB(o.s).name}</b> · ${STEPS[o.step]}<small>${o.items.map(i=>i.n).join(", ")} · ${won(o.total)}</small></button>`).join(""):'<div class="empty">아직 주문한 메뉴가 없어요</div>'}`;
V.my=()=>`<header class="hd"><h1>마이</h1></header>
 <div class="sec"><h3>이 앱에 대하여</h3><p>위진남북조 시기 중원의 인구가 대거 남쪽으로 옮겨 가고, 북방에서는 이민족과 한족이 섞여 살게 되었어요. 이 변화가 음식 생산과 식생활, 식문화에 큰 영향을 미쳤어요(자오롱광·주도경 2015).</p><p>북위 후기 낙양에는 북방의 음식문화, 유목민의 양고기와 유제품, 남방(강남)의 차와 물고기가 함께 있으며 서로 영향을 주고받았어요(${C1}). 낙양이츠는 그 식탁을 배달앱으로 옮긴 위진남북조 수업 제작물이에요.</p></div>
 <div class="sec"><h3>표시 읽는 법</h3><div class="lg">${bd("사료")}<span>원전에 기록된 사실. 원전 이름을 달았고, 누르면 원문을 볼 수 있어요.</span>${bd("설명")}<span>논문 원문을 그대로 옮긴 것. 가게 소개와 메뉴 근거에 써요.</span>${bd("창작")}<span>가게 이름, 가격, 별점, 배달 시간, 리뷰 말투처럼 지어낸 것.</span></div></div>
 <div class="sec"><h3>공지사항</h3>${NOTICES.map(n=>`<button class="ol" style="padding:10px 0" data-a="sv" data-x="${n.k}"><b>${n.t}</b><small>${n.d} · 사료 원문 보기 ›</small></button>`).join("")}</div>
 <div class="sec"><h3>쿠폰함</h3><p>${st.coupon?(st.cUsed?"낙장 1승 무료 쿠폰 (사용 완료)":"낙장 1승 무료 쿠폰 1장 · 양고기왕자 락죽공주에서 사용"):"쿠폰이 없어요. 홈 맨 위 쿠폰을 긁어 보세요."}</p></div>
 <div class="sec"><h3>참고문헌</h3><ul>
  <li>『南齊書』 卷45 · 『北史』 卷17, 卷19 · 『周書』 卷32 · 『魏書』 卷94, 卷110</li>
  <li>楊衒之, 『洛陽伽藍記』 卷2, 卷3</li><li>賈思勰, 『齊民要術』 (최덕경 2009 재인용)</li>
  <li>최진열. (2015). 북위(北魏) 후기의 국제도시 낙양(洛陽): 종족 분포와 다문화 공존을 중심으로. 『도시인문학연구』, 7(2), 135–178.</li>
  <li>최덕경. (2009). 『齊民要術』에 보이는 動植物의 배양과 胡漢 農業文化의 融合. 『중국사연구』, 62, 23–96.</li>
  <li>자오롱광, 주도경. (2015). 나의 체험적 중화음식 연구. 『아시아리뷰』, 5(1), 3–39.</li></ul></div>`;
V.event=()=>{const c=st.ch,calfDay=c.day%3===0;return hdr("하루 양 3마리 챌린지")+`
 <div class="ev"><p>${c.day}일째 · 오늘 먹은 양</p><div class="n">${c.sheep}<small> / 3마리</small></div>
  <div class="flock">${[0,1,2].map(i=>`<i class="${i<c.sheep?"on":""}">양</i>`).join("")}<i class="${calfDay&&c.calfToday?"on":""}" style="${calfDay?"":"opacity:.35"}">송</i></div>
  <p>누적: 양 ${c.total}마리 · 송아지 ${c.tc}마리</p></div>
 <div class="btns"><button class="btn" data-a="sheep" ${c.sheep>=3?"disabled":""}>양 1마리 먹기</button>
  <button class="btn" style="background:#3f5a2a" data-a="calf" ${calfDay&&!c.calfToday?"":"disabled"}>${calfDay?"송아지 1마리 먹기 (사흘째)":"송아지는 사흘째에 먹어요"}</button>
  <button class="btn l" data-a="day">다음 날로</button></div>
 ${c.tc>=1&&c.total>=9?`<div class="alert" style="margin-top:16px"><b>원휘업 달성!</b> 사흘 동안 양 9마리와 송아지 1마리를 먹었어요.</div>`:""}
 <div class="basis" style="margin:16px 20px"><h3>이 챌린지의 근거</h3>
  <p>${sb("huiye")} 원휘업은 시운이 기울자 오로지 먹고 마시는 일에만 힘써, 하루에 양 세 마리, 사흘에 송아지 한 마리를 먹었다.</p>
  <small>원전: ${SRC.huiye.src} · <button class="srcbtn" data-a="sv" data-x="huiye">원문 보기 ›</button></small>
  <div class="ex">${quote(["원태흥과 원휘업의 일화에서 당시 북위 황실 원씨 일족들이 고기를 常食하였음을 확인할 수 있다.",C1])}</div></div>`};

/* ---------- 하단 고정 ---------- */
const NAV=[["home","홈",I.home],["search","검색",I.search],["favs","즐겨찾기",I.heart],["orders","주문내역",I.list],["my","마이",I.user]];
function dock(v){let h="";
 if(v==="menu")return `<button class="cta" data-a="add">배달 카트에 담기 · ${won(unit()*st.sel.q)}</button>`;
 if(v==="cart"&&st.cart.items.length)return `<button class="cta" data-a="place">${won(cartTotal()-discount())} 주문하기</button>`;
 if(st.cart.items.length&&["home","cat","store","reviews","search","favs"].includes(v)){const d=discount(),t=cartTotal();h+=`<button class="cbar" data-a="go" data-x="cart"><i>${st.cart.items.reduce((a,i)=>a+i.q,0)}</i>카트 보기<span>${d?`<s style="opacity:.6;font-size:15px;font-weight:500">${won(t)}</s> `:""}${won(t-d)}</span></button>`}
 if(["home","search","favs","orders","my"].includes(v))h+=`<nav class="nav">${NAV.map(([k,n,ic])=>`<button class="${k===v?"on":""}" data-a="tab" data-x="${k}">${ic}${n}</button>`).join("")}</nav>`;
 return h}

/* ---------- 그리기 ---------- */
const app=document.getElementById("app");
function render(keep){const v=cur(),y=scrollY;app.innerHTML=V[v.v](v.p)+`<div class="dock" id="dock">${dock(v.v)}</div>`;
 const d=document.getElementById("dock");app.style.paddingBottom=(d.offsetHeight+12)+"px";
 if(keep)scrollTo(0,y);
 if(v.v==="home")initScratch()}
function go(v,p){cur().y=scrollY;st.stack.push({v,p});render();scrollTo(0,0)}
function back(){if(st.stack.length>1){st.stack.pop();render();scrollTo(0,cur().y||0)}}
function tab(v){st.stack=[{v}];render();scrollTo(0,0)}
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function modal(h){closeModal();const m=document.createElement("div");m.className="mo";m.innerHTML=`<div class="mo-bg" data-a="close"></div><div class="mo-sh" role="dialog">${h}</div>`;document.body.appendChild(m)}
function closeModal(){document.querySelectorAll(".mo").forEach(e=>e.remove())}

function initScratch(){const box=document.getElementById("scr"),cv=document.getElementById("scv");if(!box||!cv)return;
 const r=box.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);
 const g=c.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,"#c3c7ce");g.addColorStop(.5,"#eef0f3");g.addColorStop(1,"#b4b9c1");c.fillStyle=g;c.fillRect(0,0,r.width,r.height);
 c.fillStyle="#4a505b";c.font='700 19px "Noto Sans KR",sans-serif';c.textAlign="center";c.textBaseline="middle";c.fillText("긁어서 쿠폰 확인하기  →",r.width/2,r.height/2);
 c.globalCompositeOperation="destination-out";let down=false,n=0;
 const check=()=>{const d=c.getImageData(0,0,cv.width,cv.height).data;let k=0,t=0;for(let i=3;i<d.length;i+=200){t++;if(d[i]===0)k++}if(k/t>.42)reveal()};
 const rub=e=>{const b=cv.getBoundingClientRect();c.beginPath();c.arc(e.clientX-b.left,e.clientY-b.top,20,0,7);c.fill();if(++n%10===0)check()};
 cv.addEventListener("pointerdown",e=>{down=true;cv.setPointerCapture(e.pointerId);rub(e)});
 cv.addEventListener("pointermove",e=>{if(down)rub(e)});
 cv.addEventListener("pointerup",()=>{down=false;check()})}
function reveal(){if(st.coupon)return;st.coupon=true;toast("낙장 1승 무료 쿠폰을 받았어요");if(cur().v==="home")render(true)}

function openSrc(k){const x=SRC[k];modal(`<h3>${x.t}</h3><p>${bd("사료")} <b>${x.src}</b></p>
 <div class="orig" lang="zh-Hant">${x.orig}</div>
 <p class="kl">우리말 풀이</p><p>${x.ko}</p>
 ${x.note?`<div class="alert" style="margin:0 0 10px">${x.note}</div>`:""}
 ${k==="meat"?`<p style="color:var(--sub);font-size:13px">${NOTICES[0].body}</p>`:""}
 <button class="btn l" style="width:100%" data-a="close">닫기</button>`)}
function openNotices(){st.read=true;modal(`<h3>알림</h3><ul class="srcl">${NOTICES.map(n=>`<li><button style="text-align:left;width:100%" data-a="sv" data-x="${n.k}"><b>${n.t}</b><small>${n.d} · ${n.body}</small></button></li>`).join("")}</ul><button class="btn l" style="width:100%;margin-top:12px" data-a="close">닫기</button>`);if(cur().v==="home"){const dot=document.querySelector(".bell .dot");if(dot)dot.remove()}}
function openVote(){const v=st.vote;modal(`<h3>차 vs 낙, 당신의 선택은?</h3><p>효문제가 왕숙에게 물었어요. “차를 낙장과 비교하면 어떠한가?”</p>
 <div class="vs"><button class="${v==="tea"?"on":""}" data-a="pick" data-x="tea">차(茗)</button><button class="${v==="rak"?"on":""}" data-a="pick" data-x="rak">낙(酪)</button></div>
 ${v?`<div class="alert" style="margin:0">${sb("wangsu")} 왕숙의 대답: 양은 뭍에서 나는 것 가운데 으뜸, 물고기는 물에 사는 것 가운데 으뜸이라 둘 다 진미예요. 다만 차만은 낙의 종도 되지 못한다고 했어요.<small>원전: ${SRC.wangsu.src}</small></div><p style="margin-top:10px">당신은 <b>${v==="tea"?"차":"낙"}</b>를 골랐어요. ${v==="tea"?"강남에서 막 넘어온 왕숙과 같은 선택이에요.":"몇 년 뒤 왕숙과 같은 선택이에요."}</p>`:`<p style="color:var(--sub)">고르면 왕숙의 대답을 보여 드려요.</p>`}
 <button class="btn l" style="width:100%;margin-top:8px" data-a="close">닫기</button>`)}
function openStoreSrc(id){const s=SB(id);const items=s.groups.flatMap(g=>g[1]);modal(`<h3>${s.name} 매장·출처정보</h3><p>${bd("설명")} ${s.intro[0]} <span style="color:var(--sub)">${s.intro[1]}</span></p>
 <ul class="srcl">${items.map(m=>`<li><b>${m.n}</b><small>${m.sr?"원전: "+srcLabel(m):""}${m.sr&&m.ex?" · ":""}${m.ex?"설명: "+m.ex[1]:""}</small></li>`).join("")}</ul>
 <p style="margin-top:12px;color:var(--sub);font-size:13px">가게 이름, 가격, 별점, 배달 시간은 창작이에요.</p><button class="btn l" style="width:100%" data-a="close">닫기</button>`)}
function addCart(force){const m=M[st.sel.id];const miss=(m.opt||[]).findIndex((g,gi)=>g.req&&st.sel.o[gi]==null);
 if(miss>=0){toast(m.opt[miss].t+"을(를) 골라 주세요");return}
 if(st.cart.s&&st.cart.s!==m.s&&!force){modal(`<h3>다른 가게 메뉴가 담겨 있어요</h3><p>카트에는 같은 가게 메뉴만 담을 수 있어요. 카트를 비우고 ${m.n}을(를) 담을까요?</p><div class="btns" style="padding:0"><button class="btn" data-a="force">비우고 담기</button><button class="btn l" data-a="close">취소</button></div>`);return}
 if(force)st.cart={s:null,items:[]};
 const op=(m.opt||[]).map((g,gi)=>st.sel.o[gi]!=null?g.c[st.sel.o[gi]][0]:"").filter(Boolean).join(", ");
 const ex=st.cart.items.find(i=>i.id===m.id&&i.op===op);if(ex)ex.q+=st.sel.q;else st.cart.items.push({id:m.id,n:m.n,op,u:unit(),q:st.sel.q});
 st.cart.s=m.s;closeModal();back();toast("메뉴가 담겼습니다.")}
function place(){const o={id:Date.now(),s:st.cart.s,items:st.cart.items,total:cartTotal()-discount(),step:0,req:st.req};
 if(discount())st.cUsed=true;st.orders.unshift(o);st.cart={s:null,items:[]};st.req="";st.stack=[{v:"orders"}];go("order",o.id);
 const adv=()=>{if(o.step>=3)return;setTimeout(()=>{o.step++;const c=cur();if((c.v==="order"&&c.p===o.id)||c.v==="orders")render(true);
  if(o.step===3)modal(`<div class="done"><i>✓</i><h3>배달이 완료되었습니다</h3><p>${SB(o.s).name}의 음식이 귀정리(오인방)에 도착했어요.<br>맛있게 드시고, 다음에 또 만나요!</p></div><button class="btn" style="width:100%" data-a="close">확인</button>`);
  adv()},2600)};adv()}

document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,x=t.dataset.x;
 switch(a){
  case "back":back();break;
  case "go":closeModal();go(x);break;
  case "tab":closeModal();tab(x);break;
  case "cat":st.onlyCp=false;go("cat",x);break;
  case "ctab":cur().p=x;render();break;
  case "store":closeModal();go("store",x);break;
  case "menu":st.sel={id:x,q:1,o:{}};go("menu",x);break;
  case "reviews":go("reviews",x);break;
  case "fav":st.favs.has(x)?st.favs.delete(x):st.favs.add(x);toast(st.favs.has(x)?"즐겨찾기에 담았어요":"즐겨찾기에서 뺐어요");render(true);break;
  case "opt":{const[g,c]=x.split(":").map(Number);st.sel.o[g]=c;render(true);break}
  case "qty":st.sel.q=Math.max(1,st.sel.q+Number(x));render(true);break;
  case "add":addCart(false);break;
  case "force":addCart(true);break;
  case "cq":{const[k,d]=x.split(":").map(Number);const it=st.cart.items[k];it.q+=d;if(it.q<1)st.cart.items.splice(k,1);if(!st.cart.items.length)st.cart.s=null;render(true);break}
  case "place":place();break;
  case "order":go("order",Number(x));break;
  case "dtab":st.pickup=x==="1";render(true);break;
  case "onlyhist":st.onlyHist=!st.onlyHist;render(true);break;
  case "onlycp":st.onlyCp=!st.onlyCp;render(true);break;
  case "rvinfo":modal(`<h3>리뷰 안내</h3><p>리뷰 내용은 사료나 논문에 있는 것만 썼고, 커뮤니티 말투와 별점은 창작이에요. ‘사료 속 인물’은 기록에 나오는 사람, ‘가상 손님’은 지어낸 사람이에요. 사장님 답글은 논문 내용을 바탕으로 썼어요.</p><button class="btn l" style="width:100%" data-a="close">확인</button>`);break;
  case "vote":openVote();break;
  case "pick":st.vote=x;openVote();break;
  case "close":closeModal();break;
  case "src":openStoreSrc(x);break;
  case "sv":openSrc(x);break;
  case "notices":openNotices();break;
  case "reveal":reveal();break;
  case "coupons":modal(`<h3>미사용 쿠폰함</h3>${st.coupon&&!st.cUsed?`<div class="alert" style="margin:0"><b>낙장 1승 무료 쿠폰</b><small>양고기왕자 락죽공주 · 낙장 1승을 담으면 자동 적용</small></div><button class="btn" style="width:100%;margin-top:12px" data-a="store" data-x="s1">쿠폰 쓰러 가기</button>`:`<p>${st.cUsed?"쿠폰을 이미 사용했어요.":"아직 쿠폰이 없어요. 홈 맨 위 쿠폰을 긁어 보세요."}</p>`}<button class="btn l" style="width:100%;margin-top:10px" data-a="close">닫기</button>`);break;
  case "q":st.q=x;render(true);break;
  case "toast":toast(x);break;
  case "sheep":st.ch.sheep++;st.ch.total++;render(true);break;
  case "calf":st.ch.calfToday=true;st.ch.tc++;render(true);break;
  case "day":st.ch.day++;st.ch.sheep=0;st.ch.calfToday=false;render(true);break;
 }});
document.addEventListener("input",e=>{if(e.target.id==="sq"){st.q=e.target.value;document.getElementById("sres").innerHTML=searchRes()}if(e.target.id==="req")st.req=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
}
</script>
</body>
